services:
  postgres:
    image: postgres:15  # Using a specific version for stability
    container_name: tacocloud-postgres-ch05
    environment:
      POSTGRES_DB: tacocloud-ch05
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: tacocloud-ch05-postgres-data