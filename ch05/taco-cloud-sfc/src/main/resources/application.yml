spring:
  datasource:
    generate-unique-name: false
    name: tacocloud
    url: jdbc:h2:mem:tacocloud
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create  # Creates tables on startup, drops them on shutdown
      # OR 'update' to keep data between restarts (less useful for in-memory)
    show-sql: true  # Logs SQL for debugging
  h2:
    console:
      enabled: true
      path: /h2-console